<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parámetros — Region Sync</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/yappy.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="brand">Yappy <span>RegionSync</span></div>
    <nav>
      <a href="/">Inicio</a>
      <a href="/db-diff">DB Diff</a>
      <a href="/params-diff" class="active">Parámetros</a>
      <a href="/compile">Compilar</a>
    </nav>
  </header>
  <main>
    <h1>Diff de Parámetros / Secretos</h1>
    <p class="muted">
      Compara un parámetro entre <strong>B</strong> (fuente) y <strong>A</strong> (destino). Si el
      valor es JSON solo se actualizan las claves que cambiaron; el resto del parámetro queda intacto.
    </p>

    <div class="panel">
      <div class="form-grid">
        <div>
          <label for="env-a">Región A (destino)</label>
          <select id="env-a"></select>
        </div>
        <div>
          <label for="env-b">Región B (fuente)</label>
          <select id="env-b"></select>
        </div>
        <div>
          <label for="service">Servicio</label>
          <select id="service">
            <option value="ssm">SSM Parameter Store</option>
            <option value="secretsmanager">Secrets Manager</option>
          </select>
        </div>
        <div>
          <label for="name">Nombre del parámetro / secreto</label>
          <input type="text" id="name" placeholder="p. ej. /yappy/dev/rate" />
        </div>
      </div>
      <div class="actions" style="justify-content:flex-end;">
        <button id="compare-btn">Comparar</button>
      </div>
    </div>

    <div id="result"></div>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/params-diff.js"></script>
</body>
</html>
